name: 매일 리뷰 자동 수집

on:
  schedule:
    # 예비용. 2026-10-22부터 주 실행은 PC 작업 스케줄러가 11:00에(2026-10-23 12:17→11:00, 사용자 결정) workflow_dispatch로 시작한다
    # (scheduled/trigger_collection.py) — 예약 실행이 4~5시간씩 늦거나 빠져서. 오늘 이미 실행이 있으면
    # 아래 '오늘 이미 수집했는지 확인' 단계가 이 예약 실행을 건너뛴다.
    - cron: "7 2 * * *"  # 02:07 UTC = 11:07 KST (PC 요청 11:00 뒤 — 이미 실행 중이면 건너뜀)
  workflow_dispatch:
    inputs:
      competitor_group:
        description: "경쟁병원 그룹 (비우면 오늘 순번, all=전체, 숫자=그 그룹)"
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    # 자사 매일 수집(약 30분) + 경쟁병원 90분 예산. 어떤 경우에도 3시간 안에 끝낸다.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 수집했는지 확인 (예약 실행만)
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/daily_collect.yml/runs?per_page=10" \
            | python3 scheduled/other_runs_today.py "$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.13"

      - name: 의존 패키지 설치
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (카카오/구글 수집용)
        if: steps.gate.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: 리뷰 수집 실행
        if: steps.gate.outputs.skip != 'true'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SHEET_ID: "1-F-znYuGESKC-l1CjdxRMm6JhBRk6_Sd1LgIgzN7h2E"
          COMPETITOR_GROUP: ${{ inputs.competitor_group }}
        run: python main.py
