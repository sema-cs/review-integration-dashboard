name: 매일 리뷰 자동 수집

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC = 12:17 KST — 정각 예약은 GitHub에서 몇 시간씩 밀려 비정각으로(2026-10-20)
  workflow_dispatch:
    inputs:
      competitor_group:
        description: "경쟁병원 그룹 (비우면 오늘 순번, all=전체, 숫자=그 그룹)"
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    # 자사 매일 수집(약 30분) + 경쟁병원 90분 예산. 어떤 경우에도 3시간 안에 끝낸다.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (카카오/구글 수집용)
        run: playwright install --with-deps chromium

      - name: 리뷰 수집 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SHEET_ID: "1-F-znYuGESKC-l1CjdxRMm6JhBRk6_Sd1LgIgzN7h2E"
          COMPETITOR_GROUP: ${{ inputs.competitor_group }}
        run: python main.py
